<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>github first project</title>
<style>
.tft{
text-align: center;
font-size: 30px;
padding: auto;
margin: 0;
color: aliceblue;
}

body{
background-color: black;}

.test2{
width: 300px;
height: 300px;
overflow: hidden;
margin: 0 auto;
display: flex;
align-items: center;
border-radius: 1rem;
}
.test2 img{
width: 100%;
height: auto;
transition: transform 500ms;
}
.test2 img:hover{
transform: scale(1.5)rotate(0deg);

}

</style>
 <style>
.animate{text-align: center;
font-size: 100px;
}
.animate span{
animation-name: test1;
animation-duration: calc(var(--i)*2s);
animation-fill-mode: forwards;
animation-timing-function: ease-in-out;
animation-iteration-count: infinite;
}
@keyframes test1{
0%{color: rgb(247, 10, 247);}
10%{color:rgb(244, 63, 244);}
20%{color: rgb(224, 100, 224);}
30%{color: rgb(111, 0, 255);}
40%{color: rgb(145, 57, 233);}
50%{color: rgb(0, 106, 255);}
60%{color: rgb(0, 179, 255);}
70%{color: rgb(0, 255, 166);}
80%{color: rgb(0, 255, 8);}
90%{color: rgb(255, 42, 0);}
100%{color: rgb(255, 0, 93);}
}
</style>

</head>

<body>

<header>
<h1 class="tft">
    for bigginer developers
</h1>
</header>

<div class="animate">
<span style="--i:1">P</span>
<span style="--i:1.3">O</span>
<span style="--i:1.6">Y</span>
<span style="--i:1.9">A</span>
<span style="--i:2.2">N</span>
    </div>

<p class="tft">
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Alias nesciunt numquam similique, ex earum quaerat repellendus quisquam, quos sapiente eius quo minima, tenetur soluta quas quidem officia explicabo natus voluptatem.
</p>
<div class="test2">
<img src="./img/bird.jpeg" alt="">
</div>
</body>
